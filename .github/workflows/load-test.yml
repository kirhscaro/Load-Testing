name: Load Test Pipeline

on:
  push:
    branches:
      - master  # This triggers the workflow on push to the master branch

jobs:
  load-test:
    runs-on: ubuntu-latest  # Runs on an Ubuntu environment

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2  # Pull the latest code from your repository

    - name: Set up JMeter Docker image
      uses: docker://justb4/jmeter:5.5  # Use the official JMeter Docker image

    - name: Run JMeter Load Test
      run: |
        jmeter -n -t Load_Testing.jmx -l result.jtl -e -o report  # Run your JMeter test

    - name: Check response time threshold
      run: |
        avg_time=$(awk -F',' 'NR>1 {sum+=$2; count++} END {if(count>0) print sum/count; else print 0}' <(awk -F',' '{print $1","$2}' result.jtl))
        echo "Average response time: $avg_time ms"
        
        if (( $(echo "$avg_time > 200" | bc -l) )); then
          echo "FAILED: Avg response time exceeds 200ms"
          exit 1  # Fail the pipeline if the response time exceeds 200ms
        else
          echo "PASSED: Avg response time is within acceptable limits"
        fi
